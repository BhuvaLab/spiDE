url: https://bhuvalab.github.io/spiDE

template:
  bootstrap: 5
  light-switch: true

navbar:
  structure:
    left:  [articles, validation, reference, news]
    right: [search, github, lightswitch]
  components:
    articles:
      text: Articles
      menu:
      - text: Neighbourhood-dependent DE with spiDE
        href: articles/spiDE.html
      - text: The spiDE model
        href: articles/spiDE-model.html
    validation:
      text: Statistical validation
      menu:
      - text: Simulation study — calibration, power, FDR
        href: articles/spiDE-simulation.html
      - text: Two-stage estimation — benchmark
        href: articles/spiDE-twostage-benchmark.html
      - text: The niche-shuffle null (real cohort)
        href: articles/spiDE-shuffle-null.html
      - text: Mixed-fit speedups (re.prop)
        href: articles/spiDE-mixed-benchmark.html
      - text: Combining niche p-values — Brown vs Cauchy
        href: articles/spiDE-cauchy-vs-brown.html
      - text: Gene-set inference — spiGSEA calibration
        href: articles/spiDE-gsea-benchmark.html
      - text: -------
      - text: Standalone mirror (research site)
        href: https://bhuvalab.github.io/spiDE-research/

# The validation reports live in the research repo (submodule `research/`) and
# are published by reports/benchmarks/build_site.R to the research repo's
# GitHub Pages. pkgdown navbar entries take absolute external URLs, so each
# The validation reports are pkgdown ARTICLES rendered from symlinks in
# vignettes/articles/ into the research submodule (sources and canonical
# tables stay versioned there; ^vignettes/articles$ is .Rbuildignore'd so the
# tarball is untouched). CI reads the private submodule with a deploy key
# (secret RESEARCH_DEPLOY_KEY; see pkgdown.yaml). The research repo's own
# Pages site remains as a standalone mirror, restyled to match this site
# (research: reports/benchmarks/site/navbar.html replicates this navbar).
# Adding or renaming a report touches: the symlink, this menu, the articles
# index below, the research build_site.R list, and the navbar replica.
articles:
- title: Articles
  navbar: ~
  contents:
  - spiDE
  - spiDE-model
  - spiDE-calibration
- title: Statistical validation
  desc: >
    The measurement record behind the package defaults. Sources and canonical
    tables live in the research submodule; these pages are rendered from them.
  contents:
  - articles/spiDE-simulation
  - articles/spiDE-twostage-benchmark
  - articles/spiDE-shuffle-null
  - articles/spiDE-mixed-benchmark
  - articles/spiDE-cauchy-vs-brown
  - articles/spiDE-gsea-benchmark
