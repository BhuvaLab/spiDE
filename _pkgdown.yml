url: https://bhuvalab.github.io/spiDE

template:
  bootstrap: 5
  light-switch: true

navbar:
  structure:
    left:  [articles, validation, reference, news]
    right: [search, github, lightswitch]
  components:
    articles:
      text: Articles
      menu:
      - text: Neighbourhood-dependent DE with spiDE
        href: articles/spiDE.html
      - text: The spiDE model
        href: articles/spiDE-model.html
      - text: Calibration — what the tests were measured against
        href: articles/spiDE-calibration.html
    validation:
      text: Validation
      menu:
      - text: Simplifying spiDE — the study behind the engines (research site)
        href: https://bhuvalab.github.io/spiDE-research/simplify-top5.html

# The package site carries only the package's own vignettes. The validation
# reports are rendered and published by the research repository (submodule
# `research/`, research/reports/benchmarks/build_site.R) to its own GitHub
# Pages site, which also holds the archive of the mixed-model reports of
# spiDE <= 0.99.22. By decision of 2026-09-29, this site links only to the
# CURRENT validation reports, never to the archive. A new current report is a
# new entry in the Validation menu above, pointing at its research-site page.
articles:
- title: Articles
  navbar: ~
  contents:
  - spiDE
  - spiDE-model
  - spiDE-calibration
